# 仓库自检：语法、路径泄漏、素材完整性。
# 桌宠只能在 Windows 上跑，但静态检查可以放在 Linux runner 上做（更快更省）。
name: checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 与 Windows 行尾一致性检查（启动器必须是 CRLF）
        run: |
          set -e
          fail=0
          for f in desktop/*.bat desktop/*.vbs tools/autostart/*.cmd; do
            if [ -f "$f" ]; then
              if ! grep -q $'\r' "$f"; then
                echo "::error file=$f::应为 CRLF 行尾（.gitattributes 已声明，请检查是否被改写）"
                fail=1
              fi
            fi
          done
          exit $fail

      - name: 不要提交绝对路径 / 运行期产物
        run: |
          set -e
          fail=0
          # 允许出现在文档里的示例路径（C:\Users\<name>），但不允许真实用户名。
          # 必须排除本文件自身，否则规则里的模式会匹配到自己。
          if grep -rIn --exclude-dir=.git --exclude-dir=.github -E 'C:\\\\Users\\\\(Administrator|[A-Za-z0-9_-]+)|E:\\\\Users' . ; then
            echo "::error::发现硬编码的绝对路径，请改成 %USERPROFILE% 之类"
            fail=1
          fi
          if [ -f desktop/kun-pet-settings.json ] || [ -f desktop/kun-pet-desktop.log ]; then
            echo "::error::运行期产物不该入库（kun-pet-settings.json / kun-pet-desktop.log）"
            fail=1
          fi
          exit $fail

      - name: PowerShell 语法检查
        shell: pwsh
        run: |
          $fail = 0
          Get-ChildItem -Recurse -Include *.ps1 -File | ForEach-Object {
            $errs = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$null, [ref]$errs)
            if ($errs -and $errs.Count) {
              $fail = 1
              Write-Host ("::error file=" + $_.FullName + "::parse error: " + ($errs[0].Message))
            } else {
              Write-Host ("ok  " + $_.Name)
            }
          }
          if ($fail -ne 0) { exit 1 }

      - name: 中文脚本必须有 UTF-8 BOM（否则 Windows PowerShell 5.1 会按 ANSI 解码而报错）
        shell: pwsh
        run: |
          $fail = 0
          Get-ChildItem -Recurse -Include *.ps1 -File | ForEach-Object {
            $bytes = [IO.File]::ReadAllBytes($_.FullName)
            $hasBom = ($bytes.Length -ge 3 -and $bytes[0] -eq 0xEF -and $bytes[1] -eq 0xBB -and $bytes[2] -eq 0xBF)
            $nonAscii = ($bytes | Where-Object { $_ -gt 127 }).Count
            if ($nonAscii -gt 0 -and -not $hasBom) {
              $fail = 1
              Write-Host ("::error file=" + $_.FullName + "::含非 ASCII 字符但没有 UTF-8 BOM")
            }
          }
          # 纯 ASCII 的脚本不需要 BOM；反过来，带 BOM 的也没问题。
          if ($fail -ne 0) { exit 1 }

      - name: Node 语法检查
        run: |
          node --check plugin/index.js
          node --check plugin/client.js

      - name: pi 源适配器自测（夹具 + 接入层）
        shell: pwsh
        run: |
          # 这几套都不需要真的装 pi、也不需要起桌宠：只读夹具与系统临时目录。
          # 覆盖「toolCall/toolResult 配平判定」「多源仲裁」「多窗口（同目录多个 pi）」
          # 「子代理产物按目录层级排除」「过期快照」「大文件截断」等。
          #
          # 注意：runner 是 ubuntu + pwsh 7，没有 $env:USERPROFILE（只有 $env:HOME）。
          # 模块与测试都已按跨平台处理；这里逐个跑并明确报告是哪一套挂了。
          #
          # 这里**直接调用脚本**（`& ./x.ps1` 或 `& ./x.ps1 -Param v`），
          # 不要写成 `& pwsh -File ./x.ps1 @extraArgs` —— 那种拼法会让参数落到
          # pwsh 的位置参数上（报「找不到接受自变量的位置参数」），脚本根本不会执行，
          # 却因为退出码非 0 被记成「失败」。
          $fail = 0
          & ./desktop/tests/test-pi-source.ps1
          if ($LASTEXITCODE -ne 0) { Write-Host "::error::pi unit 测试失败"; $fail = 1 }
          & ./desktop/tests/test-pi-integration.ps1
          if ($LASTEXITCODE -ne 0) { Write-Host "::error::pi integration 测试失败"; $fail = 1 }
          & ./desktop/tests/test-pi-multiwindow.ps1 -Windows 3
          if ($LASTEXITCODE -ne 0) { Write-Host "::error::pi multiwindow 测试失败"; $fail = 1 }
          & ./desktop/tests/test-wander.ps1
          if ($LASTEXITCODE -ne 0) { Write-Host "::error::随机移动几何测试失败"; $fail = 1 }
          & ./desktop/tests/test-wander-guards.ps1
          if ($LASTEXITCODE -ne 0) { Write-Host "::error::随机移动护栏测试失败"; $fail = 1 }
          & ./desktop/tests/test-update.ps1
          if ($LASTEXITCODE -ne 0) { Write-Host "::error::更新模块测试失败"; $fail = 1 }
          & ./desktop/tests/test-update-flow.ps1 ./desktop
          if ($LASTEXITCODE -ne 0) { Write-Host "::error::更新流程测试失败"; $fail = 1 }
          if ($fail -ne 0) { exit 1 }

      - name: 版本号一致性（desktop/version.json 与脚本内兜底值）
        shell: pwsh
        run: |
          # 脚本里有一份兜底版本号（读不到 version.json 时用），必须与 version.json 一致，
          # 否则「检查更新」会误判（例如脚本写着 2.0.0、清单写着 2.1.0，
          # 于是每次启动都提示有新版却永远装不上）。
          $vj = (Get-Content ./desktop/version.json -Raw | ConvertFrom-Json).version
          $m = Select-String -Path ./desktop/kun-pet-desktop.ps1 -Pattern "Version\s*=\s*'([^']+)'"
          if (-not $m) { Write-Host "::error::脚本里找不到 Version 兜底值"; exit 1 }
          $v2 = $m.Matches[0].Groups[1].Value
          if ($vj -ne $v2) {
            Write-Host ("::error::版本号不一致：version.json=$vj 脚本=$v2")
            exit 1
          }
          Write-Host ("版本号一致：$vj")

      - name: 安装检查依赖
        run: python3 -m pip install --quiet --disable-pip-version-check Pillow

      - name: 素材完整性（pet.json 可解析 + 精灵图尺寸）
        run: python3 docs/tools/verify-assets.py

      - name: README 里引用的本地文件都存在
        run: python3 docs/tools/verify-links.py

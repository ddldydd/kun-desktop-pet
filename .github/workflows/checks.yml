# 仓库自检：语法、路径泄漏、素材完整性。
# 桌宠只能在 Windows 上跑，但静态检查可以放在 Linux runner 上做（更快更省）。
name: checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 与 Windows 行尾一致性检查（启动器必须是 CRLF）
        run: |
          set -e
          fail=0
          # 根目录的 安装.cmd 也要查：cmd.exe 对 LF 结尾的 .cmd 会出错
          for f in 安装.cmd desktop/*.bat desktop/*.vbs tools/autostart/*.cmd; do
            if [ -f "$f" ]; then
              if ! grep -q $'\r' "$f"; then
                echo "::error file=$f::应为 CRLF 行尾（.gitattributes 已声明，请检查是否被改写）"
                fail=1
              fi
            fi
          done
          exit $fail

      - name: 双击入口必须是纯 ASCII（cmd.exe 按 OEM 代码页解码 .cmd）
        run: |
          set -e
          fail=0
          # .cmd/.bat 的**内容**若含非 ASCII 字节，在中文 Windows（GBK 控制台）下
          # 会被解码成乱码甚至改变语义。文件名可以是中文，内容必须纯 ASCII。
          # 这是实测踩过的坑（写文件时用 ASCIIEncoding 会把中文静默变成 '????'）。
          for f in 安装.cmd desktop/*.bat tools/autostart/*.cmd; do
            if [ -f "$f" ]; then
              if LC_ALL=C grep -qP '[\x80-\xFF]' "$f"; then
                echo "::error file=$f::.cmd/.bat 内容含非 ASCII 字节，请在中文 Windows 上会乱码"
                fail=1
              fi
            fi
          done
          exit $fail

      - name: 安装入口与 install.ps1 的契约（-Recommended 必须存在）
        shell: pwsh
        run: |
          # 双击入口靠 install.ps1 的 -Recommended 承载「推荐默认值」。
          # 若哪天有人删了这个开关，入口会静默地什么都不做 —— 用 CI 钉住。
          $fail = 0
          $entry = './安装.cmd'
          if (-not (Test-Path $entry)) {
            Write-Host "::error::根目录缺少 安装.cmd（双击入口）"
            exit 1
          }
          $entryText = Get-Content $entry -Raw
          if ($entryText -notmatch '-Recommended') {
            Write-Host "::error::安装.cmd 没有传 -Recommended"
            $fail = 1
          }
          # 只在**非注释行**里找 -Autostart：
          # 注释里完全可能写「刻意不加 -Autostart 及原因」，那是好事，不该判失败。
          $nonComment = ($entryText -split "`r?`n") |
                        Where-Object { $_ -notmatch '^\s*(rem\b|::)' }
          $cmdLines = $nonComment -join "`n"
          if ($cmdLines -match '-Autostart') {
            Write-Host "::error::安装.cmd 不应默认注册开机自启（应由用户主动开启）"
            $fail = 1
          }
          $ps1 = Get-Content ./install.ps1 -Raw
          if ($ps1 -notmatch '\[switch\]\$Recommended') {
            Write-Host "::error::install.ps1 里没有 -Recommended 开关（入口依赖它）"
            $fail = 1
          }
          if ($fail -ne 0) { exit 1 }
          Write-Host "安装入口契约检查通过"

      - name: 不要提交绝对路径 / 运行期产物
        run: |
          set -e
          fail=0
          # 允许出现在文档里的示例路径（C:\Users\<name>），但不允许真实用户名。
          # 必须排除本文件自身，否则规则里的模式会匹配到自己。
          if grep -rIn --exclude-dir=.git --exclude-dir=.github -E 'C:\\\\Users\\\\(Administrator|[A-Za-z0-9_-]+)|E:\\\\Users' . ; then
            echo "::error::发现硬编码的绝对路径，请改成 %USERPROFILE% 之类"
            fail=1
          fi
          if [ -f desktop/kun-pet-settings.json ] || [ -f desktop/kun-pet-desktop.log ]; then
            echo "::error::运行期产物不该入库（kun-pet-settings.json / kun-pet-desktop.log）"
            fail=1
          fi
          exit $fail

      - name: PowerShell 语法检查
        shell: pwsh
        run: |
          $fail = 0
          Get-ChildItem -Recurse -Include *.ps1 -File | ForEach-Object {
            $errs = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$null, [ref]$errs)
            if ($errs -and $errs.Count) {
              $fail = 1
              Write-Host ("::error file=" + $_.FullName + "::parse error: " + ($errs[0].Message))
            } else {
              Write-Host ("ok  " + $_.Name)
            }
          }
          if ($fail -ne 0) { exit 1 }

      - name: 中文脚本必须有 UTF-8 BOM（否则 Windows PowerShell 5.1 会按 ANSI 解码而报错）
        shell: pwsh
        run: |
          $fail = 0
          Get-ChildItem -Recurse -Include *.ps1 -File | ForEach-Object {
            $bytes = [IO.File]::ReadAllBytes($_.FullName)
            $hasBom = ($bytes.Length -ge 3 -and $bytes[0] -eq 0xEF -and $bytes[1] -eq 0xBB -and $bytes[2] -eq 0xBF)
            $nonAscii = ($bytes | Where-Object { $_ -gt 127 }).Count
            if ($nonAscii -gt 0 -and -not $hasBom) {
              $fail = 1
              Write-Host ("::error file=" + $_.FullName + "::含非 ASCII 字符但没有 UTF-8 BOM")
            }
          }
          # 纯 ASCII 的脚本不需要 BOM；反过来，带 BOM 的也没问题。
          if ($fail -ne 0) { exit 1 }

      - name: 网页内宠物必须保持移除（Host 半区保留）
        shell: pwsh
        run: |
          # 需求：只保留桌面宠物，不要「Harness 网页里那只宠物」。
          # 关键在于：桌面宠物读的是 Host 半区（/kun-pet/state + /kun-pet/approval），
          # 与网页渲染无关 —— 所以移除 Client 半区不该影响桌面宠物。
          # 这几条断言防止它被无意中加回来，或防止 Host 半区被误删
          # （那才会真的让桌面宠物失去审批功能）。
          $fail = 0
          if (Test-Path ./plugin/client.js) {
            Write-Host "::error::plugin/client.js 又出现了 —— 网页内宠物应保持移除"
            $fail = 1
          }
          if (-not (Test-Path ./plugin/index.js)) {
            Write-Host "::error::缺少 plugin/index.js —— 桌面宠物会失去审批/进展数据"
            $fail = 1
          }
          $pkgText = Get-Content ./plugin/package.json -Raw
          $pkg = $null
          try { $pkg = $pkgText | ConvertFrom-Json } catch { }
          if ($null -eq $pkg) {
            Write-Host "::error::plugin/package.json 不是合法 JSON"
            $fail = 1
          } else {
            # 注意：要按 JSON **结构**判断，不能找字面量 "dsh.bundle" ——
            # 文件里是嵌套的 { "dsh": { "bundle": ... } }，没有这个字面量
            # （我第一版就是这么写错的，结果永远误报「缺 dsh.bundle」）。
            if ($null -ne $pkg.dsh.client) {
              Write-Host "::error::package.json 仍在声明 dsh.client（网页内宠物）"
              $fail = 1
            }
            if ($null -eq $pkg.dsh.bundle) {
              Write-Host "::error::package.json 缺少 dsh.bundle —— Host 半区可能不会被加载"
              $fail = 1
            }
            if ($pkg.exports.PSObject.Properties.Name -contains './client') {
              Write-Host "::error::package.json 仍导出 ./client（网页内宠物）"
              $fail = 1
            }
          }
          # 端点契约：桌面宠物依赖这三个，Host 半区必须继续提供
          $idxText = Get-Content ./plugin/index.js -Raw
          foreach ($ep in @('/kun-pet/state', '/kun-pet/approval', '/kun-pet/skin.png')) {
            if ($idxText -notmatch [regex]::Escape($ep)) {
              Write-Host ("::error::index.js 里找不到端点 " + $ep + " —— 桌面宠物功能会缺失")
              $fail = 1
            }
          }
          if ($fail -ne 0) { exit 1 }
          Write-Host "网页内宠物已移除；Host 半区与三个端点齐备"

      - name: 插件安装必须躲开 pnpm 剪枝（junction + .local-plugins）
        shell: pwsh
        run: |
          # 实测踩到的坑：profile 用 nodeLinker: hoisted，pnpm 每次 install 都会把
          # 「package.json 里没声明」的目录从 node_modules 剪到 node_modules\.ignored\。
          # 插件一被剪走，/kun-pet/state 就 404，桌宠只剩读会话缓存的降级通道：
          # 审批气泡不弹、桌宠上没有 ✓/✗，日志只有一行 plugin channel: unavailable。
          # 所以 install.ps1 必须：① 正文放 .local-plugins\kun-pet；
          # ② node_modules 里只放目录联接；③ uninstall 两处都清。
          $fail = 0
          $install = Get-Content ./install.ps1 -Raw
          $uninstall = Get-Content ./uninstall.ps1 -Raw
          if ($install -notmatch '\.local-plugins') {
            Write-Host '::error::install.ps1 没有把插件正文放进 .local-plugins —— 会被 pnpm 剪掉'
            $fail = 1
          }
          if ($install -notmatch 'ItemType Junction') {
            Write-Host '::error::install.ps1 没有建目录联接 —— 直接拷贝会被 pnpm 剪掉'
            $fail = 1
          }
          if ($install -notmatch '\.ignored') {
            Write-Host '::error::install.ps1 没有清理历史被剪到 .ignored 的旧副本'
            $fail = 1
          }
          if ($uninstall -notmatch '\.local-plugins') {
            Write-Host '::error::uninstall.ps1 没有清 .local-plugins —— 卸载后会残留'
            $fail = 1
          }
          if ($fail -ne 0) { exit 1 }
          Write-Host '插件安装路径检查通过（.local-plugins + junction）'

      - name: Node 语法检查
        run: |
          # plugin/client.js（Harness 网页内的宠物渲染）已从仓库移除，
          # 只剩 Host 半区 index.js。别再把已删文件写进检查，否则 CI 必挂。
          node --check plugin/index.js
          if [ -f plugin/client.js ]; then
            echo "::error::plugin/client.js 不应存在（网页内宠物已移除）"
            exit 1
          fi

      - name: pi 源适配器自测（夹具 + 接入层）
        shell: pwsh
        run: |
          # 这几套都不需要真的装 pi、也不需要起桌宠：只读夹具与系统临时目录。
          # 覆盖「toolCall/toolResult 配平判定」「多源仲裁」「多窗口（同目录多个 pi）」
          # 「子代理产物按目录层级排除」「过期快照」「大文件截断」等。
          #
          # 注意：runner 是 ubuntu + pwsh 7，没有 $env:USERPROFILE（只有 $env:HOME）。
          # 模块与测试都已按跨平台处理；这里逐个跑并明确报告是哪一套挂了。
          #
          # 这里**直接调用脚本**（`& ./x.ps1` 或 `& ./x.ps1 -Param v`），
          # 不要写成 `& pwsh -File ./x.ps1 @extraArgs` —— 那种拼法会让参数落到
          # pwsh 的位置参数上（报「找不到接受自变量的位置参数」），脚本根本不会执行，
          # 却因为退出码非 0 被记成「失败」。
          $fail = 0
          & ./desktop/tests/test-pi-source.ps1
          if ($LASTEXITCODE -ne 0) { Write-Host "::error::pi unit 测试失败"; $fail = 1 }
          & ./desktop/tests/test-pi-integration.ps1
          if ($LASTEXITCODE -ne 0) { Write-Host "::error::pi integration 测试失败"; $fail = 1 }
          & ./desktop/tests/test-pi-multiwindow.ps1 -Windows 3
          if ($LASTEXITCODE -ne 0) { Write-Host "::error::pi multiwindow 测试失败"; $fail = 1 }
          & ./desktop/tests/test-wander.ps1
          if ($LASTEXITCODE -ne 0) { Write-Host "::error::随机移动几何测试失败"; $fail = 1 }
          & ./desktop/tests/test-wander-guards.ps1
          if ($LASTEXITCODE -ne 0) { Write-Host "::error::随机移动护栏测试失败"; $fail = 1 }
          & ./desktop/tests/test-position.ps1
          if ($LASTEXITCODE -ne 0) { Write-Host "::error::DPI/夹紧纯逻辑测试失败"; $fail = 1 }
          & ./desktop/tests/test-update.ps1
          if ($LASTEXITCODE -ne 0) { Write-Host "::error::更新模块测试失败"; $fail = 1 }
          & ./desktop/tests/test-update-flow.ps1 ./desktop
          if ($LASTEXITCODE -ne 0) { Write-Host "::error::更新流程测试失败"; $fail = 1 }
          & ./desktop/tests/test-notice.ps1
          if ($LASTEXITCODE -ne 0) { Write-Host "::error::气泡提示测试失败"; $fail = 1 }
          if ($fail -ne 0) { exit 1 }

      - name: 版本号一致性（desktop/version.json 与脚本内兜底值）
        shell: pwsh
        run: |
          # 脚本里有一份兜底版本号（读不到 version.json 时用），必须与 version.json 一致，
          # 否则「检查更新」会误判（例如脚本写着 2.0.0、清单写着 2.1.0，
          # 于是每次启动都提示有新版却永远装不上）。
          # 显式 UTF8 读：Windows PowerShell 5.1 的 Get-Content 默认按 ANSI 解码，
          # 无 BOM 的 UTF-8 中文会被读成乱码并破坏 JSON（ubuntu pwsh7 无此问题，
          # 但本地 Windows 调试时会误报版本不一致）。
          $vj = ([IO.File]::ReadAllText("$PWD/desktop/version.json", [Text.Encoding]::UTF8) | ConvertFrom-Json).version
          $m = Select-String -Path ./desktop/kun-pet-desktop.ps1 -Pattern "Version\s*=\s*'([^']+)'"
          if (-not $m) { Write-Host "::error::脚本里找不到 Version 兜底值"; exit 1 }
          $v2 = $m.Matches[0].Groups[1].Value
          if ($vj -ne $v2) {
            Write-Host ("::error::版本号不一致：version.json=$vj 脚本=$v2")
            exit 1
          }
          Write-Host ("版本号一致：$vj")

      - name: 内嵌备用脚本与源文件一致（ensure-pet-shortcut.ps1 ↔ base64）
        shell: pwsh
        run: |
          # kun-pet-update.ps1 里内嵌了一段 petShortcutFallbackB64，是老版本就地升级、
          # 且 make-shortcut.ps1 还没被更新下来时的兜底（用来画快捷方式图标）。
          # 它的源文件是 desktop/ensure-pet-shortcut.ps1。两者一旦漂移，兜底路径会
          # 悄悄失效（快捷方式建不出来 / 图标不对），而且只在老版本升级场景才暴露，
          # 平时根本测不到。这里用与运行时完全相同的规范化口径做字节级比对：
          #   去 BOM -> 统一 LF -> UTF-8 编码 -> Base64。
          # 注意：仓库 checkout 出的 .ps1 是 LF，本地 Windows checkout 会是 CRLF，
          # 所以必须规范化后才能比对，不能直接比 raw bytes。
          $src = './desktop/ensure-pet-shortcut.ps1'
          if (-not (Test-Path $src)) {
            Write-Host "::error::缺少 desktop/ensure-pet-shortcut.ps1（内嵌备用脚本的源文件）"
            exit 1
          }
          $bytes = [IO.File]::ReadAllBytes($src)
          $hasBom = ($bytes.Length -ge 3 -and $bytes[0] -eq 0xEF -and $bytes[1] -eq 0xBB -and $bytes[2] -eq 0xBF)
          if ($hasBom) { $bytes = $bytes[3..($bytes.Length - 1)] }
          $text = [Text.Encoding]::UTF8.GetString($bytes).Replace("`r`n", "`n").Replace("`r", "`n")
          $b64 = [Convert]::ToBase64String([Text.Encoding]::UTF8.GetBytes($text))
          $upd = Get-Content ./desktop/kun-pet-update.ps1 -Raw
          $m = [regex]::Match($upd, "petShortcutFallbackB64 = '([A-Za-z0-9+/=]+)'")
          if (-not $m.Success) {
            Write-Host "::error::kun-pet-update.ps1 里找不到 petShortcutFallbackB64"
            exit 1
          }
          if ($m.Groups[1].Value -ne $b64) {
            Write-Host "::error::内嵌 base64 与 ensure-pet-shortcut.ps1 不一致（改了源文件要重新生成 base64）"
            exit 1
          }
          Write-Host "内嵌备用脚本与源文件一致"

      - name: 安装检查依赖
        run: python3 -m pip install --quiet --disable-pip-version-check Pillow

      - name: 素材完整性（pet.json 可解析 + 精灵图尺寸）
        run: python3 docs/tools/verify-assets.py

      - name: README 里引用的本地文件都存在
        run: python3 docs/tools/verify-links.py
